name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate
      - run: git diff --exit-code -- packages/api-contracts/generated
      - run: pnpm lint
      - run: docker compose up -d --wait
      - run: DATABASE_URL=postgres://intero:intero@127.0.0.1:5432/intero pnpm --filter @intero/server-api migrate
      - run: DATABASE_URL=postgres://intero_worker:intero_worker@127.0.0.1:5432/intero pnpm --filter @intero/server-worker migrate
      - run: INTERO_SPICEDB_ENDPOINT=127.0.0.1:50051 INTERO_SPICEDB_TOKEN=intero-development pnpm --filter @intero/server-api migrate:spicedb
      - name: Test TypeScript with real dependencies
        run: pnpm test:ts
        env:
          DATABASE_URL: postgres://intero:intero@127.0.0.1:5432/intero
          DATABASE_APP_URL: postgres://intero_app:intero_app@127.0.0.1:5432/intero
          INTERO_WORKER_DATABASE_URL: postgres://intero_worker:intero_worker@127.0.0.1:5432/intero
          INTERO_SPICEDB_ENDPOINT: 127.0.0.1:50051
          INTERO_SPICEDB_TOKEN: intero-development
          INTERO_CENTRIFUGO_API_URL: http://127.0.0.1:8000
          INTERO_S3_ENDPOINT: http://127.0.0.1:9000
      - run: ./scripts/backup-restore-smoke.sh
      - run: pnpm build
      - if: always()
        run: docker compose down
