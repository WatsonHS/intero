name: intero-production

x-app-environment: &app-environment
  NODE_ENV: production
  INTERO_RUNTIME_MODE: product
  INTERO_API_HOST: 0.0.0.0
  INTERO_API_PORT: 4310
  INTERO_PUBLIC_URL: ${INTERO_PUBLIC_URL:?Set INTERO_PUBLIC_URL}
  INTERO_AUTH_SECRET: ${INTERO_AUTH_SECRET:?Set INTERO_AUTH_SECRET}
  INTERO_AUTH_TRUSTED_ORIGINS: ${INTERO_PUBLIC_URL:?Set INTERO_PUBLIC_URL}
  INTERO_DATABASE_URL: postgres://intero_app:${INTERO_POSTGRES_APP_PASSWORD:?Set INTERO_POSTGRES_APP_PASSWORD}@postgres:5432/intero
  INTERO_PROVIDER_ENCRYPTION_KEY: ${INTERO_PROVIDER_ENCRYPTION_KEY:?Set INTERO_PROVIDER_ENCRYPTION_KEY}
  INTERO_PILOT_PERSISTENCE: postgres
  INTERO_PILOT_STAND_IN_JOBS: transactional-outbox
  INTERO_PILOT_AUTHORIZATION: spicedb
  INTERO_SPICEDB_ENDPOINT: spicedb:50051
  INTERO_SPICEDB_TOKEN: ${INTERO_SPICEDB_TOKEN:?Set INTERO_SPICEDB_TOKEN}
  INTERO_SPICEDB_CA_PATH: /run/intero/spicedb/ca.crt
  INTERO_CENTRIFUGO_API_URL: http://centrifugo:8000
  INTERO_CENTRIFUGO_API_KEY: ${INTERO_CENTRIFUGO_API_KEY:?Set INTERO_CENTRIFUGO_API_KEY}
  INTERO_CENTRIFUGO_PUBLIC_URL: ${INTERO_PUBLIC_URL:?Set INTERO_PUBLIC_URL}
  INTERO_CENTRIFUGO_TOKEN_SECRET: ${INTERO_CENTRIFUGO_TOKEN_SECRET:?Set INTERO_CENTRIFUGO_TOKEN_SECRET}
  # Defaults to wss://<INTERO_PUBLIC_URL host>/rtc, served by the bundled LiveKit through Caddy.
  INTERO_LIVEKIT_URL: ${INTERO_LIVEKIT_URL:-}
  INTERO_LIVEKIT_API_KEY: ${INTERO_LIVEKIT_API_KEY:?Set INTERO_LIVEKIT_API_KEY}
  INTERO_LIVEKIT_API_SECRET: ${INTERO_LIVEKIT_API_SECRET:?Set INTERO_LIVEKIT_API_SECRET}
  INTERO_OBJECT_STORAGE: minio
  INTERO_OBJECT_STORAGE_ENDPOINT: http://minio:9000
  INTERO_OBJECT_STORAGE_REGION: us-east-1
  INTERO_OBJECT_STORAGE_ACCESS_KEY_ID: ${INTERO_MINIO_ACCESS_KEY:?Set INTERO_MINIO_ACCESS_KEY}
  INTERO_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${INTERO_MINIO_SECRET_KEY:?Set INTERO_MINIO_SECRET_KEY}
  INTERO_OBJECT_STORAGE_BUCKET: ${INTERO_OBJECT_STORAGE_BUCKET:-intero-objects}
  INTERO_OBJECT_STORAGE_ENCRYPTION: AES256
  INTERO_METRICS_ENABLED: "true"
  INTERO_LOG_LEVEL: ${INTERO_LOG_LEVEL:-info}

services:
  postgres:
    image: postgres:18-alpine
    command: ["postgres", "-c", "track_commit_timestamp=on"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: intero
      POSTGRES_PASSWORD: ${INTERO_POSTGRES_ADMIN_PASSWORD:?Set INTERO_POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: intero
      INTERO_POSTGRES_APP_PASSWORD: ${INTERO_POSTGRES_APP_PASSWORD:?Set INTERO_POSTGRES_APP_PASSWORD}
      INTERO_POSTGRES_WORKER_PASSWORD: ${INTERO_POSTGRES_WORKER_PASSWORD:?Set INTERO_POSTGRES_WORKER_PASSWORD}
      INTERO_POSTGRES_SPICEDB_PASSWORD: ${INTERO_POSTGRES_SPICEDB_PASSWORD:?Set INTERO_POSTGRES_SPICEDB_PASSWORD}
      INTERO_POSTGRES_ADMIN_PASSWORD: ${INTERO_POSTGRES_ADMIN_PASSWORD:?Set INTERO_POSTGRES_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:${INTERO_POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/010-production-roles.sh:/docker-entrypoint-initdb.d/010-production-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intero -d intero"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s

  postgres-provision:
    image: postgres:18-alpine
    profiles: ["migrate"]
    environment:
      PGHOST: postgres
      PGPORT: 5432
      POSTGRES_USER: intero
      POSTGRES_DB: intero
      INTERO_POSTGRES_BOOTSTRAP_PASSWORD: ${INTERO_POSTGRES_BOOTSTRAP_PASSWORD:?Set INTERO_POSTGRES_BOOTSTRAP_PASSWORD}
      INTERO_POSTGRES_ADMIN_PASSWORD: ${INTERO_POSTGRES_ADMIN_PASSWORD:?Set INTERO_POSTGRES_ADMIN_PASSWORD}
      INTERO_POSTGRES_APP_PASSWORD: ${INTERO_POSTGRES_APP_PASSWORD:?Set INTERO_POSTGRES_APP_PASSWORD}
      INTERO_POSTGRES_WORKER_PASSWORD: ${INTERO_POSTGRES_WORKER_PASSWORD:?Set INTERO_POSTGRES_WORKER_PASSWORD}
      INTERO_POSTGRES_SPICEDB_PASSWORD: ${INTERO_POSTGRES_SPICEDB_PASSWORD:?Set INTERO_POSTGRES_SPICEDB_PASSWORD}
    volumes:
      - ./infra/postgres/010-production-roles.sh:/usr/local/bin/intero-provision:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/intero-provision"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  spicedb-migrate:
    image: authzed/spicedb:v1.56.0
    profiles: ["migrate"]
    command: ["datastore", "migrate", "head"]
    environment: &spicedb-environment
      SPICEDB_DATASTORE_ENGINE: postgres
      SPICEDB_DATASTORE_CONN_URI: postgres://intero_spicedb:${INTERO_POSTGRES_SPICEDB_PASSWORD:?Set INTERO_POSTGRES_SPICEDB_PASSWORD}@postgres:5432/intero_spicedb?sslmode=disable
      SPICEDB_LOG_FORMAT: json
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  spicedb:
    image: authzed/spicedb:v1.56.0
    command: ["serve"]
    restart: unless-stopped
    environment:
      <<: *spicedb-environment
      SPICEDB_GRPC_PRESHARED_KEY: ${INTERO_SPICEDB_TOKEN:?Set INTERO_SPICEDB_TOKEN}
      SPICEDB_GRPC_TLS_CERT_PATH: /run/intero/spicedb/server.crt
      SPICEDB_GRPC_TLS_KEY_PATH: /run/intero/spicedb/server.key
    volumes:
      - ${INTERO_SPICEDB_CERT_FILE:-./.intero-production/spicedb-server.crt}:/run/intero/spicedb/server.crt:ro
      - ${INTERO_SPICEDB_KEY_FILE:-./.intero-production/spicedb-server.key}:/run/intero/spicedb/server.key:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "spicedb", "datastore", "head"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 10s

  centrifugo:
    image: centrifugo/centrifugo:v6.8.1
    command: ["centrifugo", "-c", "/centrifugo/config.json"]
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${INTERO_CENTRIFUGO_TOKEN_SECRET:?Set INTERO_CENTRIFUGO_TOKEN_SECRET}
      CENTRIFUGO_HTTP_API_KEY: ${INTERO_CENTRIFUGO_API_KEY:?Set INTERO_CENTRIFUGO_API_KEY}
      CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: ${INTERO_PUBLIC_URL:?Set INTERO_PUBLIC_URL}
    volumes:
      - ./infra/centrifugo/config.production.json:/centrifugo/config.json:ro

  livekit:
    image: livekit/livekit-server:v1.13.1
    command: ["--bind", "0.0.0.0"]
    restart: unless-stopped
    environment:
      LIVEKIT_KEYS: "${INTERO_LIVEKIT_API_KEY:?Set INTERO_LIVEKIT_API_KEY}: ${INTERO_LIVEKIT_API_SECRET:?Set INTERO_LIVEKIT_API_SECRET}"
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: info
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: true
    ports:
      - "${INTERO_LIVEKIT_TCP_PORT:-7881}:7881"
      - "${INTERO_LIVEKIT_UDP_PORT:-7882}:7882/udp"

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: ["server", "/data"]
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${INTERO_MINIO_ACCESS_KEY:?Set INTERO_MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${INTERO_MINIO_SECRET_KEY:?Set INTERO_MINIO_SECRET_KEY}
      MINIO_KMS_SECRET_KEY: intero-default:${INTERO_MINIO_KMS_KEY:?Set INTERO_MINIO_KMS_KEY}
      MINIO_KMS_AUTO_ENCRYPTION: "off"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 10s

  migrator:
    image: intero-migrator:${INTERO_MIGRATOR_IMAGE_TAG:-local}
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgres://intero:${INTERO_POSTGRES_ADMIN_PASSWORD:?Set INTERO_POSTGRES_ADMIN_PASSWORD}@postgres:5432/intero
      INTERO_WORKER_DATABASE_URL: postgres://intero_worker:${INTERO_POSTGRES_WORKER_PASSWORD:?Set INTERO_POSTGRES_WORKER_PASSWORD}@postgres:5432/intero
      INTERO_SPICEDB_ENDPOINT: spicedb:50051
      INTERO_SPICEDB_TOKEN: ${INTERO_SPICEDB_TOKEN:?Set INTERO_SPICEDB_TOKEN}
      INTERO_SPICEDB_CA_PATH: /run/intero/spicedb/ca.crt
    volumes:
      - ${INTERO_SPICEDB_CA_FILE:-./.intero-production/spicedb-ca.crt}:/run/intero/spicedb/ca.crt:ro
    depends_on:
      postgres:
        condition: service_healthy
      spicedb:
        condition: service_healthy
    restart: "no"

  worker:
    image: intero-worker:${INTERO_IMAGE_TAG:-local}
    build:
      context: .
      target: worker
    init: true
    restart: unless-stopped
    environment:
      <<: *app-environment
      INTERO_WORKER_DATABASE_URL: postgres://intero_worker:${INTERO_POSTGRES_WORKER_PASSWORD:?Set INTERO_POSTGRES_WORKER_PASSWORD}@postgres:5432/intero
      INTERO_WORKER_METRICS_HOST: 0.0.0.0
      INTERO_WORKER_METRICS_PORT: 9464
      INTERO_WORKER_CONCURRENCY: ${INTERO_WORKER_CONCURRENCY:-8}
    volumes:
      - ${INTERO_SPICEDB_CA_FILE:-./.intero-production/spicedb-ca.crt}:/run/intero/spicedb/ca.crt:ro
    depends_on:
      migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      spicedb:
        condition: service_healthy
      centrifugo:
        condition: service_started
      livekit:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:9464/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 15s

  api:
    image: intero-api:${INTERO_IMAGE_TAG:-local}
    build:
      context: .
      target: api
    init: true
    restart: unless-stopped
    environment:
      <<: *app-environment
    volumes:
      - ${INTERO_SPICEDB_CA_FILE:-./.intero-production/spicedb-ca.crt}:/run/intero/spicedb/ca.crt:ro
    depends_on:
      migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      spicedb:
        condition: service_healthy
      worker:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4310/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 15s

  gateway:
    image: intero-gateway:${INTERO_IMAGE_TAG:-local}
    build:
      context: .
      target: gateway
    restart: unless-stopped
    environment:
      INTERO_PUBLIC_URL: ${INTERO_PUBLIC_URL:?Set INTERO_PUBLIC_URL}
    ports:
      - "${INTERO_CADDY_PORT:-443}:${INTERO_CADDY_LISTEN_PORT:-443}"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      centrifugo:
        condition: service_started
      livekit:
        condition: service_started

volumes:
  postgres-data:
    name: ${INTERO_POSTGRES_VOLUME:-intero-production-postgres}
  caddy-data:
    name: ${INTERO_CADDY_DATA_VOLUME:-intero-production-caddy-data}
  caddy-config:
    name: ${INTERO_CADDY_CONFIG_VOLUME:-intero-production-caddy-config}
  minio-data:
    name: ${INTERO_MINIO_VOLUME:-intero-production-minio}
