name: intero-proxy

services:
  caddy:
    image: caddy:2.11.4-alpine
    environment:
      INTERO_PUBLIC_URL: "${INTERO_PUBLIC_URL:-http://localhost:4311}"
    ports:
      - "${INTERO_CADDY_PORT:-4311}:${INTERO_CADDY_LISTEN_PORT:-4311}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - intero-caddy-data:/data
      - intero-caddy-config:/config
    restart: unless-stopped

volumes:
  intero-caddy-data:
  intero-caddy-config:
