name: intero

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: intero
      POSTGRES_PASSWORD: intero
      POSTGRES_DB: intero
    ports:
      - "5432:5432"
    volumes:
      - intero-postgres:/var/lib/postgresql
      - ./infra/postgres/001-create-app-user.sql:/docker-entrypoint-initdb.d/001-create-app-user.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intero"]
      interval: 5s
      timeout: 3s
      retries: 12

  spicedb:
    image: authzed/spicedb:v1.56.0
    command: serve
    environment:
      SPICEDB_GRPC_PRESHARED_KEY: intero-development
      SPICEDB_DATASTORE_ENGINE: memory
    ports:
      - "50051:50051"
      - "8443:8443"

  centrifugo:
    image: centrifugo/centrifugo:v6.8.1
    command: centrifugo -c /centrifugo/config.json
    environment:
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${INTERO_CENTRIFUGO_TOKEN_SECRET:-intero-development-realtime-token-secret-v1}
      CENTRIFUGO_HTTP_API_KEY: ${INTERO_CENTRIFUGO_API_KEY:-intero-development-realtime-api-key-v1}
    volumes:
      - ./infra/centrifugo/config.json:/centrifugo/config.json:ro
    ports:
      - "8000:8000"

  livekit:
    image: livekit/livekit-server:v1.13.1
    command: ["--dev", "--bind", "0.0.0.0"]
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: intero
      MINIO_ROOT_PASSWORD: intero-development
      # Development-only static KMS key. Production must use MinIO KMS/KES.
      MINIO_KMS_SECRET_KEY: intero-default:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      MINIO_KMS_AUTO_ENCRYPTION: "off"
    ports:
      - "${INTERO_MINIO_API_PORT:-29000}:9000"
      - "${INTERO_MINIO_CONSOLE_PORT:-29001}:9001"
    volumes:
      - intero-minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  intero-postgres:
  intero-minio:
